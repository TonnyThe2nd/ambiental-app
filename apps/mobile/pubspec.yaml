name: urbaneye_mobile
description: Aplicativo móvel UrbanEye para ocorrências ambientais.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^7.0.0
  crypto: ^3.0.7
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_map: ^8.2.2
  flutter_secure_storage: ^9.2.4
  geolocator: ^14.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.5.0
  image_picker: ^1.2.1
  latlong2: ^0.9.1
  uuid: ^4.5.2
  workmanager: ^0.10.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
