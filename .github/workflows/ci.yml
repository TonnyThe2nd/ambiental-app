name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: urbaneye_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d urbaneye_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend/api

      - name: Apply database migrations
        run: python -m src.migrate
        working-directory: backend/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/urbaneye_test
          MIGRATIONS_DIR: ../database/migrations

      - name: Run tests
        run: pytest -q
        working-directory: backend/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/urbaneye_test
          JWT_SECRET: test-secret-com-pelo-menos-32-caracteres

  mobile:
    name: Mobile analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Analyze code
        run: flutter analyze
        working-directory: apps/mobile

      - name: Run tests
        run: flutter test
        working-directory: apps/mobile
